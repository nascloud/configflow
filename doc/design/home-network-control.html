}

function policiesPreview(){return `<section class="card"><div class="card-head"><div><h2>策略路由</h2><p>当前选择 · 点击进入代理策略</p></div>${linkBtn('管理','policies')}</div><div class="policy-preview">${state.groups.slice(0,4).map(g=>`<button class="policy-row" style="width:100%;text-align:left" data-nav="policies"><span class="row">${icon(g.icon)}${g.name}</span><span class="node-mini">${esc(g.current)}</span><span class="latency mono">${g.delay} ms</span></button>`).join('')}</div></section>`}

function overview(){return header('网络总览','每一条连接，尽在掌握。',`${badge('<span class="dot"></span> 示例网络健康','green')}${action('发布配置','publish','upload','primary')}`)+kpis()+`<div class="grid-main">${topology()}${health()}</div><div class="grid-two">${chart()}${policiesPreview()}</div><section class="card"><div class="card-head"><div class="row"><h2>活跃设备</h2>${badge('TOP 4')}</div>${linkBtn('查看全部设备','devices')}</div>${deviceTable(4)}</section>`}

function policiesPage(){return header('代理策略','观察运行态选择，保留配置态意图。',badge('6 个策略组 · 76 个示例节点'),'TRAFFIC / PROXY STRATEGIES')+sourceNote('节点切换演示仅改变运行态；“固定为配置”才会加入发布草稿。自动组手动选择须由内核能力确认，当前原型不提供自动组强选。')+`<div class="group-grid">${state.groups.map((g,i)=>`<section class="card group-card"><div class="between"><h3 class="row">${icon(g.icon)}${g.name}</h3>${badge(g.kind)}</div><div class="group-current"><div class="between"><span class="tiny muted">当前出口</span><span class="accent mono tiny">${g.delay} ms</span></div><strong style="display:block;margin-top:9px">${esc(g.current)}</strong></div><div class="node-options">${nodes.map((n,j)=>`<button class="node-option ${n[0]===g.current?'selected':''}" data-node="${i},${j}" ${g.kind!=='SELECT'||state.scenario!=='normal'?'disabled':''}><span>${n[0]}</span><span class="mono">${n[1]}</span></button>`).join('')}</div><div class="group-bottom"><span>${g.kind==='SELECT'?'切换对新连接生效':'由内核自动管理 · 只读预览'}</span><button class="btn ghost" data-pin="${i}" ${g.kind!=='SELECT'?'disabled':''}>固定为配置</button></div></section>`).join('')}</div>`}
function tabs(list,selected){return `<div class="tabs">${list.map(([id,label])=>`<button class="${id===selected?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div>`}

function subscriptionsPage(){

  else if(tab==='guard')body=`<div class="notice info">${icon('shield')}本平台新增守护设计。未在 ikuai-bypass 中发现独立探活与故障切换状态机；其旁路自愈依赖拓扑与爱快配置。</div><div class="grid-two"><section class="card feature"><div class="between"><h2>旁路故障守护</h2><button class="switch" role="switch" aria-checked="${state.guard}" aria-label="旁路守护演示开关" data-action="guard"></button></div><p>探测失败窗口 + 恢复冷却；在 iKuai 侧切换受管入口规则，避免故障时反复抖动。</p><div class="status-card"><div class="between"><span>${state.failover?'旁路异常 · 已切换预设直连':'旁路健康 · 策略入口正常'}</span>${badge(state.failover?'演示降级':'演示健康',state.failover?'amber':'green')}</div><div class="rule-chain" style="margin-top:18px">家庭设备 <span class="arrow">→</span> iKuai <span class="arrow">→</span> ${state.failover?'WAN 01 直连':'Mihomo 旁路'}</div></div><div class="form-actions">${action(state.failover?'模拟恢复':'模拟旁路故障','failover','activity')}</div></section><section class="card feature"><h2>安全边界</h2><p>只切换被纳管的流量；设备可选「故障直连」或「故障断网」。不把隐私敏感流量自动送到公网直连。独立守护必须同时处理 DNS 降级。</p><div class="detail-grid"><div><span class="tiny muted">故障窗口</span><p class="mono">3 次 / 15 秒</p></div><div><span class="tiny muted">恢复冷却</span><p class="mono">60 秒</p></div></div><div class="inline-note">阈值为设计示例，不是现有工具的默认承诺；演示恢复不等待冷却计时。</div></section></div>`;
  else body=`<section class="card"><div class="card-head"><h2>同步计划</h2>${badge('演示 · 不执行定时任务')}</div><div class="table-wrap"><table><thead><tr><th>任务</th><th>计划</th><th>变更保护</th><th>最近结果</th><th></th></tr></thead><tbody>${[['区域 IP 同步','每天 03:00','差异 + 删除阈值',0],['域名分流同步','每天 03:15','保留非受管规则',2],['IPv6 分组同步','每天 03:30','按固件限制分块',3]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="muted">${r[2]}</td><td>${badge('样例成功','green')}</td><td><button class="btn ghost" data-bypass="${r[3]}">预演</button></td></tr>`).join('')}</tbody></table></div></section><section class="card feature" style="margin-top:18px"><div class="between"><h3>受管规则清理</h3>${badge('高风险 · 仅预演','amber')}</div><p>精确所有权匹配 + 引用检查。上游 tag 子串清理不能直接等同为本平台的安全清理；空订阅也不能自动视为删除授权。</p><button class="btn" data-action="cleanup-preview">查看清理预演</button></section><div class="inline-note" style="margin-top:18px">${icon('alert')}同步前缓存原始数据；应用、确认和清理分阶段执行。不可假设爱快支持多对象原子事务。</div>`;
  return header('爱快分流','复用已核实的分流能力，明确标出新增守护与拦截设计。',badge('版本适配 · 管理隔离'),'GATEWAY / ROUTING ORCHESTRATION')+tabs([['routing','分流编排'],['guard','旁路守护'],['jobs','同步任务']],tab)+body;
}
function dnsPage(){return header('DNS 解析','直接使用 Mihomo DNS，不再引入 MosDNS。',badge('DNS 与路由共享发布版本','green'),'NETWORK / NAME RESOLUTION')+`<div class="grid-two"><section class="card feature"><h2>单一解析链路</h2><p>终端 DNS → Mihomo DNS → nameserver-policy → 直连 / 加密上游。iKuai 继续负责 DHCP、网关与流量入口。</p><div class="rule-chain">客户端 <span class="arrow">→</span> <span class="purple">Mihomo :53</span><span class="arrow">→</span> 上游 DNS</div><div class="detail-grid" style="margin-top:25px"><div><span class="tiny muted">引导解析</span><p class="mono">default-nameserver</p></div><div><span class="tiny muted">节点域名解析</span><p class="mono">proxy-server-nameserver</p></div><div><span class="tiny muted">内网域名</span><p>指定内网权威源</p></div><div><span class="tiny muted">IPv6</span><p>DNS 与路由一起验收</p></div></div></section><section class="card feature"><h2>解析诊断</h2><p>交互样例只包含 example.com，不发送真实 DNS 请求。</p><form id="dns-form"><div class="field"><label for="dns-name">域名</label><input id="dns-name" class="input mono" value="example.com" required></div><button class="btn primary" type="submit">${icon('search')}运行演示查询</button></form><div id="dns-result" style="margin-top:20px" aria-live="polite"></div></section></div><div class="notice">${icon('alert')}Fake-IP 必须先确保虚拟地址段会路由回 Mihomo，不能发给纯直连终端后放任直出。旁路失效时还需恢复 DNS，不能只改路由。</div><section class="card feature"><h2>能观察什么，不能观察什么</h2><p>Mihomo 提供主动 DNS 查询与缓存清理接口，但完整历史查询、每终端统计和命中率不是默认保证。若无采集来源，显示「未采集」，不生成虚构指标。客户端自带 DoH 也不等于可完整观测。</p></section>`}
function releasesPage(){return header('配置发布','从草稿到运行态，每一步有版本、有确认、有退路。',action(state.publishing?'演示发布中…':`发布 ${state.draft.length} 项变更`,'publish','upload','primary'),'OPERATIONS / RELEASES')+`<div class="kpis"><div class="card kpi"><div class="kpi-top">期望版本</div><div class="kpi-value num">r${state.version+(state.draft.length?1:0)}</div></div><div class="card kpi"><div class="kpi-top">已确认运行版本</div><div class="kpi-value num">r${state.version}</div></div><div class="card kpi"><div class="kpi-top">待发布变更</div><div class="kpi-value num">${state.draft.length}<small>项</small></div></div><div class="card kpi"><div class="kpi-top">状态</div><div style="margin-top:23px">${badge(state.publishStatus||'运行态与已发布版本一致',state.publishStatus.includes('失败')?'amber':'green')}</div></div></div><div class="grid-two"><section class="card"><div class="card-head"><h2>待发布差异</h2>${badge('敏感信息脱敏')}</div><div class="card-body">${state.draft.length?state.draft.map(d=>`<div class="diff" style="margin-bottom:10px"><strong>${esc(d.label)}</strong><br><span class="plus">+ ${esc(d.detail)}</span></div>`).join(''):'<div class="empty"><h3>没有待发布变更</h3><p>在规则中心编辑，或在代理策略中固定节点选择。</p><button class="btn" style="margin-top:15px" data-nav="rules">前往规则中心</button></div>'}</div></section><section class="card"><div class="card-head"><h2>安全发布流水线</h2></div><div class="card-body"><div class="timeline">${[['编译与依赖校验','引用完整性、规则顺序、目标内核配置校验'],['预演与快照','生成脱敏差异，保存两个执行器的已知良好版本'],['应用与运行确认','先准备下游，再变更入口；分别读取确认结果'],['失败补偿','按阶段恢复，不把部分成功显示成全部成功']].map(([t,d])=>`<div class="timeline-item"><h3>${t}</h3><p>${d}</p></div>`).join('')}</div></div></section></div><div class="notice">${icon('alert')}本页只演示发布状态机；没有调用真实内核、爱快接口或远程 Agent。默认保留旧连接，新连接使用新策略。</div>`}
function eventsPage(){const base=[{time:'20:24:12',title:'配置运行确认',detail:`演示版本 r${state.version} · Mihomo 配置读取确认`},{time:'20:15:00',title:'订阅差异检查',detail:'演示来源 · 无节点删除 · 不代表真实同步'},{time:'20:00:00',title:'网络观测快照',detail:'iKuai 与 Mihomo 数据分别计量'}];return header('事件日志','连接变化、配置发布、旁路切换，都可追溯。',badge('当前会话 · 刷新清空'),'OPERATIONS / EVENT STREAM')+`<section class="card"><div class="table-wrap"><table><thead><tr><th>时间</th><th>事件</th><th>上下文</th><th>环境</th></tr></thead><tbody>${[...state.events,...base].map(e=>`<tr><td class="mono muted">${e.time}</td><td>${esc(e.title)}</td><td class="muted">${esc(e.detail)}</td><td>${badge('演示')}</td></tr>`).join('')}</tbody></table></div></section>`}
function architecturePage(){return header('家庭网络，一个控制面。','不是后台拼接，而是可观测、可解释、可发布的网络操作台。',badge('PRODUCT BLUEPRINT / 2026.09'),'NEXHOME / THE NETWORK CONTROL PLANE')+`<div class="plan-grid">${[['01 / OBSERVE','全网可见','iKuai：WAN、AP、终端、连接与网关。Mihomo：经过内核的连接、规则与代理链。分开采集，按证据关联。'],['02 / ORCHESTRATE','策略可解释','NexHome 维护订阅、聚合、节点、规则和策略。爱快负责粗粒度入口分流，Mihomo 负责应用级流量策略。'],['03 / APPLY','变更可确认','配置只保留一个意图源。草稿 → 编译 → 差异 → 应用 → 运行确认。旁路守护必须独立于总控 UI 存活。']].map(([n,t,d])=>`<section class="card feature"><div class="plan-step mono">${n}</div><h2 style="font-size:22px">${t}</h2><p>${d}</p></section>`).join('')}</div><section class="card feature" style="margin-bottom:18px"><h2>架构决策</h2><div class="plan-text" style="margin-top:16px"><p><strong>前端：</strong>沿用 Vue 3、shadcn-vue / Reka UI、Tailwind 4、ECharts。此文件为零依赖 HTML 交互设计，不冒充生产组件实现。</p><p><strong>后端：</strong>复用现有配置模型与生成器；新增 iKuai Adapter、Mihomo Adapter、观测关联层与发布协调器。浏览器不持有路由密码或内核 secret。</p><p><strong>DNS：</strong>Mihomo DNS 直接承接解析；没有 MosDNS 服务、侧车或配置入口。内网域名、Fake-IP 路由、IPv6 与故障降级一起迁移。</p><p><strong>边界：</strong>不读取 HTTPS 内容；不承诺发现交换机全部物理端口；不把 NAT 后的源 IP 猜成真实设备；数据必须带来源与采集时间。</p></div></section><div class="feature-grid" style="margin-bottom:18px"><section class="card feature"><h2>从大到小的信息路径</h2><p>站点 → 线路 / 网关 → 网段 / AP → 设备 → 连接 → 命中规则 → 策略组 → 节点 → 配置版本。</p><div class="rule-chain">宏观健康 <span class="arrow">→</span> 影响范围 <span class="arrow">→</span> 原因 <span class="arrow">→</span> 安全变更</div></section><section class="card feature"><h2>实施顺序</h2><p><strong>① 只读接入：</strong>版本探测、采集、终端关联、指标口径。<br><strong>② 发布闭环：</strong>运行切换、校验、版本、确认、回滚。<br><strong>③ 分流纳管：</strong>ikuai-bypass 功能、独立守护、DNS 迁移。</p></section></div><section class="card feature"><div class="between"><h2>调研来源</h2>${badge('一手资料优先')}</div><p>下列是资料链接，不是页面运行依赖。完整边界与实施验收见同目录规划文档。</p><div class="sources">${[['iKuai · 终端监控','https://www.ikuai8.com/zhic/ymgn/lyym/ztjk/7cf09.html'],['iKuai · 线路监控','https://www.ikuai8.com/support/ymgn/lyym/ztjk/cda78.html'],['Mihomo · 控制 API','https://wiki.metacubex.one/api/'],['Mihomo · DNS 配置','https://wiki.metacubex.one/config/dns/'],['MetaCubeXD · 官方控制台','https://github.com/MetaCubeX/metacubexd'],['Zashboard · 代理交互参考','https://github.com/Zephyruso/zashboard'],['ikuai-bypass · 功能与源码','https://github.com/joyanhui/ikuai-bypass'],['shadcn-vue · 组件体系','https://www.shadcn-vue.com/']].map(([t,u])=>`<a class="source" href="${u}" target="_blank" rel="noreferrer">${t}${icon('external')}</a>`).join('')}</div></section>`}
const views={overview,topology:topologyPage,devices:devicesPage,connections:connectionsPage,policies:policiesPage,rules:rulesPage,subscriptions:subscriptionsPage,bypass:bypassPage,dns:dnsPage,releases:releasesPage,events:eventsPage,architecture:architecturePage};
function render(){document.getElementById('navigation').innerHTML=navItems.map(([id,label,ic,count,section])=>`${section?`<div class="nav-label">${section}</div>`:''}<button class="nav ${state.page===id?'active':''}" data-nav="${id}" ${state.page===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span>${count?`<span class="count mono">${count}</span>`:''}${id==='releases'&&state.draft.length?`<span class="count">${state.draft.length}</span>`:''}</button>`).join('');document.getElementById('crumb').textContent=navItems.find(n=>n[0]===state.page)[1];document.getElementById('sidebar-version').textContent=`rev.${String(state.version).padStart(3,'0')}`;root.innerHTML=`<div class="view">${snapshotNotice()}${state.scenario==='empty'?'':views[state.page]()}</div>`;if(state.publishing)root.querySelectorAll('[data-action="publish"]').forEach(b=>b.disabled=true);hydrate()}
function closeOverlay(){document.getElementById('overlay-root').innerHTML='';document.body.style.overflow='';document.querySelector('.main').inert=false;document.querySelector('.sidebar').inert=false;if(previousFocus?.isConnected)previousFocus.focus()}

function sheetHead(tag,title,sub=''){return `<div class="sheet-head"><div><div class="sheet-label">${tag}</div><h2>${title}</h2>${sub?`<p class="tiny muted" style="margin-top:8px">${sub}</p>`:''}</div><button class="iconbtn" data-action="close" aria-label="关闭详情">${icon('close')}</button></div>`}
function deviceDetail(i){const d=devices[i];openOverlay(sheetHead('DEVICE / NETWORK IDENTITY',d.name,`${d.ip} · ${d.room}`)+`<div class="notice info">${icon('check')}演示设备 · 字段不代表真实网络发现结果</div><dl class="detail-grid"><div><dt>MAC 地址</dt><dd class="mono">${d.mac}</dd></div><div><dt>接入位置</dt><dd>${d.access}</dd></div><div><dt>当前下载</dt><dd class="mono">${d.speed}</dd></div><div><dt>今日流量</dt><dd class="mono">${d.usage}</dd></div><div><dt>地址来源</dt><dd>DHCP 租约关联示例</dd></div><div><dt>数据范围</dt><dd>全网：iKuai / 代理：Mihomo</dd></div></dl><div class="sheet-section"><h3>当前访问路径</h3><div class="rule-chain">${d.name}<span class="arrow">→</span>${d.group==='DIRECT'?'iKuai 直连':'iKuai → Mihomo'}</div><button class="btn" style="margin-top:15px;width:100%" data-trace="${i}">追踪 ${d.domain} ${icon('arrow')}</button></div><div class="sheet-section"><h3>设备访问策略</h3><div class="field"><label for="device-policy">期望策略 · 发布后生效</label><select class="input" id="device-policy"><option>智能分流</option><option>仅直连</option><option>流媒体</option><option>故障时断网</option></select></div><button class="btn primary" data-device-save="${i}">加入配置草稿</button></div>`,'sheet',d.name)}

function editRule(index){const r=index<0?{name:'',type:'DOMAIN-SUFFIX',value:'',policy:'自动优选',enabled:true}:state.rules[index];openOverlay(sheetHead('DESIRED CONFIG / RULE',index<0?'新增策略规则':'编辑策略规则','保存仅修改草稿，不直接操作运行中的网络。')+`<form id="rule-form" data-index="${index}"><div class="field"><label for="rule-name">规则名称</label><input class="input" id="rule-name" required maxlength="60" value="${esc(r.name)}"></div><div class="field"><label for="rule-type">匹配类型</label><select class="input" id="rule-type">${['DOMAIN-SUFFIX','DOMAIN','IP-CIDR','RULE-SET','GEOSITE','MATCH'].map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="rule-value">匹配内容 · MATCH 无需填写</label><input class="input mono" id="rule-value" value="${r.value==='—'?'':esc(r.value)}" maxlength="180"></div><div class="field"><label for="rule-policy">目标策略</label><select class="input" id="rule-policy">${['DIRECT','REJECT',...state.groups.map(g=>g.name)].map(p=>`<option ${r.policy===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label for="rule-enabled">规则状态</label><select id="rule-enabled" class="input"><option value="true" ${r.enabled?'selected':''}>启用</option><option value="false" ${!r.enabled?'selected':''}>停用</option></select></div><p class="tiny muted">新增规则插入最终兜底之前；唯一 MATCH 保持末位。真实发布还需目标内核校验。</p><p class="tiny amber" id="rule-error" role="alert"></p><div class="form-actions"><button class="btn" type="button" data-action="close">取消</button><button class="btn primary" type="submit">保存到草稿</button></div></form>`,'modal','编辑策略规则')}

async function executePublish(){
  if(state.publishing)return;
  state.failPublish=document.getElementById('publish-outcome').value==='failure';
  state.publishing=true;
  const target=state.version+1;
  document.querySelectorAll('.modal button,.modal select').forEach(b=>b.disabled=true);
  const steps=['生成配置与引用校验','保存各执行器已知良好快照','应用变更并读取各目标状态',state.failPublish?'确认失败，执行补偿回滚':'运行确认成功，记录发布版本'];
  for(let i=0;i<steps.length;i++){
    const progress=document.getElementById('release-progress');
    if(progress)progress.innerHTML=`<div class="status-card" style="margin-top:18px"><span class="mono accent">0${i+1} / 04</span><p style="margin-top:8px">${steps[i]} · 演示</p></div>`;
    await new Promise(r=>setTimeout(r,450));
  }
  if(state.failPublish){
    state.publishStatus='确认失败 · 已回滚';
    addEvent('发布失败并回滚',`目标 r${target} 未确认，恢复 r${state.version}；全部草稿保留`);
  }else{
    commitEdge(target);
    state.version=target;state.draft=[];state.publishStatus='发布成功 · 已确认';
    addEvent('配置发布成功',`演示版本 r${target} 已应用并确认`);
  }
  state.publishing=false;closeOverlay();nav('releases');
  toast(state.failPublish?'演示失败：运行配置保持原版本，草稿已保留。':'演示发布成功：各执行器已确认新版本。');
}

function edgeDraft(kind,value){
  const key=`${kind}:${value.id}`;
  edge.pending.set(key,{kind,value});

  draft(`${edgeNames[kind]}：${value.name}`,Object.entries(value).filter(([k])=>!['id','credential','loaded','detected','handshake','revision'].includes(k)).map(([k,v])=>`${k}=${v}`).join('；'));

function commitEdge(revision){

function edgeEditor(kind,id){
  const item=edgeRows(kind).find(x=>x.id===id);
  const defaults={...edge[kind][0],id:`new-${++edge.serial}`,name:`新建${edgeNames[kind]}`};
  delete defaults.revision;
  if(!item&&kind==='certs'){defaults.loaded=null;defaults.days=0}
  if(!item&&kind==='ddns'){defaults.current='';defaults.detected=''}
  if(!item&&kind==='services')defaults.domain='new.example.com';
  if(!item&&kind==='wireguard'){defaults.address=`10.77.0.${edge.serial}/32`;defaults.handshake='未建立';defaults.status='已授权'}
  const current=item?edgeCurrent(kind,item):defaults;
  const fields=edgeFields[kind].map(([key,label,type])=>{
    const options=typeof type==='function'?type():type;
    const input=Array.isArray(options)?`<select id="edge-${key}" name="${key}" class="input">${options.map(o=>{const [value,text]=Array.isArray(o)?o:[o,o];return `<option value="${esc(value)}" ${current[key]===value?'selected':''}>${esc(text)}</option>`}).join('')}</select>`:`<input id="edge-${key}" name="${key}" class="input" value="${esc(current[key]??'')}" required maxlength="250" ${type==='number'?'type="number" min="0" max="86400"':''}>`;
    return `<div class="field ${['domains','upstream','scope','credential','origin','server'].includes(key)?'wide':''}"><label for="edge-${key}">${esc(label)}</label>${input}</div>`;
  }).join('');
  openOverlay(sheetHead('CONFIGURATION / DESIRED STATE',`${item?'编辑':'新增'}${edgeNames[kind]}`,'只保存演示草稿；请勿输入真实 token、密码或私钥。')+
    `<form id="edge-editor" data-kind="${kind}" data-key="${current.id}"><div class="edge-form">${fields}</div><div class="notice">${icon('shield')}发布前检查依赖、端口与路由。变更不会立刻覆盖已应用配置。</div><p id="edge-error" role="alert" class="amber tiny"></p><div class="form-actions"><button type="button" class="btn" data-action="close">取消</button><button type="submit" class="btn primary">保存到发布草稿</button></div></form>`,'modal',`${edgeNames[kind]}配置`);
  document.getElementById('edge-editor').edgeBase=current;
}
function edgeValidate(kind,v){
  for(const [key] of edgeFields[kind])if(!String(v[key]).trim())return '所有配置项必须填写，不能仅包含空格。';
  for(const key of ['port','listen','serverPort','remotePort'])if(key in v&&(!Number.isInteger(+v[key])||+v[key]<1||+v[key]>65535))return '端口必须为 1–65535 的整数。';
  if(kind==='services'||kind==='cloudflare'){
    try{const u=new URL(v.upstream||v.origin);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)return '上游仅允许不携带凭据的 HTTP/HTTPS URL。'}catch{return '请输入完整上游 URL，例如 http://10.0.0.49:8096。'}
  }
  if(kind==='services'&&edgeRows(kind).some(r=>r.id!==v.id&&edgeCurrent(kind,r).domain===v.domain&&edgeCurrent(kind,r).port===v.port))return '该域名与监听端口已被另一个服务使用。';
  if(kind==='certs'&&v.challenge==='HTTP-01'&&v.domains.includes('*'))return 'HTTP-01 不支持通配符，请选择 DNS-01。';
  if(kind==='ddns'&&((v.record==='AAAA')!==v.source.includes('IPv6')))return '记录类型与地址来源不匹配：AAAA 必须使用稳定 IPv6 来源。';
  if(kind==='tailscale'){
    if(v.routes.includes('/0'))return '子网宣告不能使用默认路由；请独立配置出口节点。';
    if(v.control==='Headscale 自建'&&v.server==='https://controlplane.tailscale.com')return '自建 Headscale 必须填写自己的控制端 URL。';
  }
  if(kind==='wireguard'){
    if(v.allowed.includes('/0')&&v.mode!=='全隧道 · 明确授权')return '默认路由需要明确选择全隧道授权。';
    if(v.mode==='全隧道 · 明确授权'&&!v.allowed.includes('/0'))return '全隧道模式需显式填写默认路由。';
    if(edgeRows(kind).some(r=>r.id!==v.id&&edgeCurrent(kind,r).address===v.address))return '隧道地址已被其他 Peer 使用。';
    if(+v.keepalive>65535)return 'Keepalive 超出有效范围。';
  }
  if(kind==='frp'&&v.mode==='私有 STCP'&&v.protocol==='UDP')return 'STCP 对应 TCP；UDP 请选择公网映射，本原型未提供 SUDP 表单。';
  if(kind==='zerotier'&&!/^[0-9a-f]{16}$/i.test(v.networkId))return 'Network ID 必须为 16 位十六进制。';
  return '';
}

  const s=item;
  const steps=kind==='services'?
    [['域名解析',s.domain,'演示记录'],['公网入口',s.access==='仅私有组网'?'不开放公网，仅私有网络':'443 / 外部可达性未验证','边界明确'],['TLS 证书',edge.certs.find(c=>c.id===s.cert)?.domains||'未找到证书','需握手核验'],['Nginx',`已应用 r${s.revision||24} · ${s.websocket} WebSocket`,'演示加载'],['上游服务',s.upstream,'演示探测 200']]:
    [['本地执行器',`${edgeNames[kind]} · 家庭接入节点`,'演示运行'],['连接与授权',kind==='zerotier'?s.authorization:kind==='cloudflare'?s.access:s.server,'需真实确认'],['目标资源',s.local||s.origin||s.routes,'配置可见'],['外部访问','未运行外部探针，不宣称端到端可达','未验证']];
  openOverlay(sheetHead('PATH INSPECTOR / APPLIED SNAPSHOT',s.name,'仅使用已应用演示快照；待发布配置不会伪装成运行结果。')+
    `<div class="edge-diagnostics">${steps.map(([title,detail,status],i)=>`<div class="trace-step"><span class="step-num mono">0${i+1}</span><div class="grow"><h4>${title}</h4><p>${esc(detail)}</p></div>${badge(status,status.includes('未')?'amber':'')}</div>`).join('')}</div><div class="notice edge-callout">${icon('alert')}这是可解释链路的演示，不是实际的 DNS、TLS、网络或 HTTP 检测。</div>`,'sheet','服务链路诊断');
}

}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-edge]');if(!b||b.disabled)return;
  e.preventDefault();if(state.publishing)return;
  const op=b.dataset.edge,kind=b.dataset.kind,id=b.dataset.key;
  if(state.scenario!=='normal'&&['diagnose','renew','sync','authorize','mesh-path','tunnel-check'].includes(op)){toast('采集离线：只允许编辑草稿，停止运行操作。');return}

  }

    const item=edgeRows(kind).find(x=>x.id===id),value={...edgeCurrent(kind,item)};

  }

    openOverlay(sheetHead('IDENTITY / AUTHORIZATION','Tailscale 授权演示','真实登录需跳转控制端；本原型不会打开登录页或获取令牌。')+`<div class="notice">${icon('shield')}批准节点身份与批准路由是两个步骤。这里只演示已获授权后的配置意图。</div><div class="form-actions">${edgeButton('模拟身份已批准','approve-identity','tailscale',id,true)}</div>`,'modal','节点授权演示');

  }
  else if(op==='mesh-path'){
    openOverlay(sheetHead('TRANSPORT / PATH EVIDENCE','连接路径演示','只切换可视化场景，不实际发起 NAT 探测。')+`<div class="edge-choice-grid">${['直接连接','DERP 中继'].map(p=>`<button class="edge-choice" data-edge="set-path" data-path="${p}"><span><strong>${p}</strong><p>${p==='直接连接'?'对等路径建立':'无法直连时经中继；不是配置失败'}</p></span></button>`).join('')}</div>`,'modal','连接路径演示');
  }else if(op==='set-path'){edge.tailscale[0].path=b.dataset.path;addEvent('路径场景切换',b.dataset.path+' · 演示');closeOverlay();render()}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='edge-editor'){
    e.preventDefault();if(state.publishing)return;
    const form=e.target,kind=form.dataset.kind;
    const value={...form.edgeBase,...Object.fromEntries(new FormData(form)),id:form.dataset.key};
    const error=edgeValidate(kind,value);if(error){document.getElementById('edge-error').textContent=error;return}
    edgeDraft(kind,value);closeOverlay();render();
  }else if(e.target.id==='edge-migration'){e.preventDefault();addEvent('Lucky 迁移检查（演示）','已记录三个确认项，尚未切换监听或更新 DNS');toast('检查结果已记入事件日志；没有执行实际迁移。')}
});
render();
</script>
</body>
</html>
